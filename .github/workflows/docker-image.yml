name: Docker image

on:
  push:
    branches:
      - production
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional additional image tag
        required: false
        type: string
      deploy:
        description: Deploy the built image to the configured server
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
      sha_tag: ${{ steps.image.outputs.sha_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tags
        id: image
        shell: bash
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          sha_tag="${image}:${GITHUB_SHA}"
          tags="${sha_tag}"
          if [ "${GITHUB_REF_NAME}" = "production" ]; then
            tags="${tags}"$'\n'"${image}:production"
          fi
          if [ -n "${INPUT_IMAGE_TAG}" ]; then
            tags="${tags}"$'\n'"${image}:${INPUT_IMAGE_TAG}"
          fi
          {
            echo "image=${image}"
            echo "sha_tag=${sha_tag}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ github.sha }}
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true }}
    runs-on: ubuntu-latest

    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          script: |
            cd /opt/crawlobserver/app/deploy
            ./deploy-app.sh "${{ needs.build.outputs.sha_tag }}"
